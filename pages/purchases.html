<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchases — INVOZA</title><link rel="stylesheet" href="../assets/app.css"></head><body onload="loadProducts().then(fillProductOptions)"><nav class="dashnav"><div class="brand">INVOZA</div><ul class="dashlinks"><li><a href="dashboard.html">Dashboard</a></li><li><a href="inventory.html">Inventory</a></li><li><a href="invoicing.html">Billing</a></li><li><a class="active" href="purchases.html">Purchases</a></li><li><a href="bills.html">Invoices</a></li><li><a href="sales.html">Sales</a></li><li><a href="reports.html">Reports</a></li></ul><button class="btn logout" onclick="logout()">Logout</button></nav><main class="container"><h1>Stock Purchase</h1><div class="panel"><div id="alert" class="alert"></div><form onsubmit="purchaseSubmit(event)"><div class="two-col"><div class="field"><label>Product</label><select id="product_id" name="product_id" required></select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" required></div><div class="field"><label>Purchase Amount (₹)</label><input name="amount" type="number" min="0" step="0.01"></div><div class="field"><label>Supplier</label><input name="supplier"></div></div><button class="btn btn-primary">Add Stock</button></form></div><div class="panel"><h2>Recent Purchases</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th><th>Supplier</th></tr></thead><tbody id="purchaseRows"></tbody></table></div></div></main><script src="../assets/script.js"></script><script>loadTable('/purchases','#purchaseRows','purchases')</script></body></html>
