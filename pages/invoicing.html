<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing — INVOZA</title><link rel="stylesheet" href="../assets/app.css"></head><body onload="loadProducts().then(fillProductOptions)"><nav class="dashnav"><div class="brand">INVOZA</div><ul class="dashlinks"><li><a href="dashboard.html">Dashboard</a></li><li><a href="inventory.html">Inventory</a></li><li><a class="active" href="invoicing.html">Billing</a></li><li><a href="purchases.html">Purchases</a></li><li><a href="bills.html">Invoices</a></li><li><a href="sales.html">Sales</a></li><li><a href="reports.html">Reports</a></li></ul><button class="btn logout" onclick="logout()">Logout</button></nav><main class="container"><h1>Create Invoice</h1><div id="billAlert" class="alert"></div><div class="panel"><div class="two-col"><div class="field"><label>Customer Name</label><input id="customer" placeholder="Walk-in Customer"></div><div class="field"><label>Payment Mode</label><select id="payment"><option>Cash</option><option>UPI</option><option>Card</option><option>Credit</option></select></div></div><div class="two-col"><div class="field"><label>Product</label><select id="billProduct"></select></div><div class="field"><label>Quantity</label><input id="billQty" type="number" min="1" value="1"></div></div><button type="button" class="btn btn-primary" onclick="addBillRow()">+ Add Item</button><div class="table-wrap" style="margin-top:20px"><table class="data-table"><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Amount</th><th></th></tr></thead><tbody id="billRows"></tbody></table></div><div style="max-width:420px;margin:20px 0 0 auto"><div class="field"><label>Tax %</label><input id="taxRate" type="number" min="0" step="0.01" value="0" oninput="calcBill()"></div><p>Subtotal: <b id="subtotal">₹0.00</b></p><p>Tax: <b id="tax">₹0.00</b></p><h2>Total: <span id="total">₹0.00</span></h2><button class="btn btn-primary" onclick="invoiceSubmit(event)">Generate Invoice</button></div></div></main><div id="toast" class="toast"></div><script src="../assets/script.js"></script></body></html>
