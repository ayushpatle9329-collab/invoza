<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory — INVOZA</title><link rel="stylesheet" href="../assets/app.css"></head><body onload="loadProducts()"><nav class="dashnav"><div class="brand">INVOZA</div><ul class="dashlinks"><li><a href="dashboard.html">Dashboard</a></li><li><a class="active" href="inventory.html">Inventory</a></li><li><a href="invoicing.html">Billing</a></li><li><a href="purchases.html">Purchases</a></li><li><a href="bills.html">Invoices</a></li><li><a href="sales.html">Sales</a></li><li><a href="reports.html">Reports</a></li></ul><button class="btn logout" onclick="logout()">Logout</button></nav><main class="container"><div class="page-head"><div><h1>Inventory</h1><p class="muted">Add, edit, search and manage products.</p></div><input class="search" oninput="filterProducts(this.value)" placeholder="Search product, SKU, supplier..."></div><div class="panel"><h2 id="formTitle">Add Product</h2><div id="formAlert" class="alert"></div><form onsubmit="productSubmit(event)"><input type="hidden" id="pid" name="id"><div class="two-col"><div class="field"><label>Product Name</label><input id="name" name="name" required></div><div class="field"><label>Category</label><input id="category" name="category" placeholder="Medicine / Stationery"></div><div class="field"><label>SKU</label><input id="sku" name="sku"></div><div class="field"><label>Price (₹)</label><input id="price" name="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Stock</label><input id="stock" name="stock" type="number" min="0" required></div><div class="field"><label>Supplier</label><input id="supplier" name="supplier"></div></div><button class="btn btn-primary">Save Product</button> <button type="reset" class="btn" onclick="document.getElementById('pid').value='';document.getElementById('formTitle').textContent='Add Product'">Clear</button></form></div><div class="panel"><h2>Products</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Supplier</th><th>Action</th></tr></thead><tbody id="productRows"></tbody></table></div></div></main><div id="toast" class="toast"></div><script src="../assets/script.js"></script></body></html>
