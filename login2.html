<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — INVOZA</title>
    <link rel="stylesheet" href="../assets/app.css" />
  </head>
  <body class="form-page">
    <div class="form-card">
      <div style="text-align: center">
        <img
          src="../assets/photos/logo1.png"
          style="width: 65px; height: 65px; object-fit: contain"
          alt="INVOZA"
        />
      </div>
      <h1>Login to INVOZA</h1>
      <div id="alert" class="alert"></div>
      <form onsubmit="loginSubmit(event)">
        <div class="field">
          <label>Email</label
          ><input
            id="email"
            type="email"
            required
            placeholder="Enter your email"
          />
        </div>
        <div class="field">
          <label>Password</label
          ><input
            id="password"
            type="password"
            required
            placeholder="Enter your password"
          />
        </div>
        <button class="btn btn-primary" style="width: 100%">Login</button>
      </form>
      <p style="text-align: center">
        Need an account?
        <a href="signup.html" style="color: #078ab0; font-weight: 700"
          >Sign up</a
        >
      </p>
      <div class="demo">Demo: admin@invoza.com / admin123</div>
    </div>
    <script src="../assets/script.js"></script>
  </body>
</html>
