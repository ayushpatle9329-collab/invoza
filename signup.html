<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up — INVOZA</title>
    <link rel="stylesheet" href="../assets/app.css" />
  </head>
  <body class="form-page">
    <div class="form-card">
      <div style="text-align: center">
        <img
          src="../assets/photos/logo1.png"
          style="width: 65px; height: 65px; object-fit: contain"
          alt="INVOZA"
        />
      </div>
      <h1>Create INVOZA Account</h1>
      <div id="alert" class="alert"></div>
      <form onsubmit="signupSubmit(event)">
        <div class="field">
          <label>Name</label
          ><input id="name" required placeholder="Your name" />
        </div>
        <div class="field">
          <label>Email</label
          ><input
            id="email"
            type="email"
            required
            placeholder="you@example.com"
          />
        </div>
        <div class="field">
          <label>Password</label
          ><input
            id="password"
            type="password"
            minlength="6"
            required
            placeholder="Minimum 6 characters"
          />
        </div>
        <div class="field">
          <label>Confirm Password</label
          ><input id="confirm" type="password" required />
        </div>
        <button class="btn btn-primary" style="width: 100%">
          Create Account
        </button>
      </form>
      <p style="text-align: center">
        Already have an account?
        <a href="login2.html" style="color: #078ab0; font-weight: 700">Login</a>
      </p>
    </div>
    <script src="../assets/script.js"></script>
  </body>
</html>
